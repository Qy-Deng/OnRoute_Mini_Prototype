const toOptions=['North Campus · Leinweber','North Campus · Pierpont','Central Campus · Ross','Central Campus · CCTC','Central Campus · Shapiro','Beekman on Broadway','Traver Heights'];
const days=['Mon','Tue','Wed','Thu','Fri'];
const rideFixtures=[
{id:'h1',name:'Maya L.',initials:'ML',skin:'',from:'Beekman on Broadway',to:'North Campus · Leinweber',day:'Wed',time:'10:15',seats:3,trips:32,rating:4.9,description:'Drives this route to class every Wednesday.'},
{id:'h11',name:'Jordan K.',initials:'JK',skin:'a2',from:'Beekman on Broadway',to:'North Campus · Leinweber',day:'Wed',time:'10:35',seats:1,trips:17,rating:4.8,description:'Flexible pickup near the main entrance.'},
{id:'h2',name:'Sofia R.',initials:'SR',skin:'a3',from:'Traver Heights',to:'North Campus · Pierpont',day:'Fri',time:'10:30',seats:2,trips:23,rating:4.9,description:'Regular Friday campus commute.'},

{id:'h5',name:'Taylor S.',initials:'TS',skin:'a3',from:'The Courtyards',to:'Central Campus · CCTC',day:'Tue',time:'10:30',seats:3,trips:21,rating:4.8,description:'Quick Tuesday ride to Central Campus.'},
{id:'h6',name:'Noah P.',initials:'NP',skin:'',from:'Willowtree Apartments',to:'North Campus · Pierpont',day:'Mon',time:'10:15',seats:2,trips:18,rating:4.8,description:'Regular Monday trip to North Campus.'},

let state={view:'home',mode:'rider',search:{from:'Beekman on Broadway',to:'North Campus · Leinweber',day:'Wed',time:'10:20',window:15,repeat:true},searched:false,selected:'h1',booking:null,disruption:false,shareLocation:true,hostDraft:{from:'Beekman on Broadway',to:'North Campus · Leinweber',day:'Wed',time:'10:15',seats:2},hostPublished:[],hostPreview:false,modal:null};
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function timeToMinutes(v){const p=String(v).split(':');return Number(p[0])*60+Number(p[1])}
function formatted(v){let [h,m]=String(v).split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
function allRides(){return [...rideFixtures,...state.hostPublished]}
function getRide(id){return allRides().find(r=>r.id===id)||rideFixtures[0]}
function minutesApart(r){return Math.abs(timeToMinutes(r.time)-timeToMinutes(state.search.time))}
function exactRoute(r){return r.from===state.search.from&&r.to===state.search.to&&r.day===state.search.day}
function matches(){return allRides().filter(r=>r.seats>0&&exactRoute(r)&&minutesApart(r)<=Number(state.search.window)).sort((a,b)=>minutesApart(a)-minutesApart(b))}
function optionList(arr,selected){return arr.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
const navItems=[['home','Home','home'],['find','Find a ride','search'],['bookings','My bookings','calendar'],['safety','Trust & safety','shield'],['host','Host a ride','car']];
function sidebar(){return `<div class="brand"><span class="brand-mark">${I('route','xl')}</span><div><div class="brand-name">On<em>Route</em></div><div class="brand-sub">Campus carpooling</div></div></div><div class="nav-label">Rider space</div><div class="nav-list">${navItems.map(([v,l,ic])=>`<button type="button" class="nav-item ${state.view===v?'active':''}" data-nav="${v}" aria-current="${state.view===v?'page':'false'}">${I(ic)} <span>${l}</span>${v==='bookings'&&state.booking?'<span class="right">●</span>':''}</button>`).join('')}</div><div class="sidebar-bottom"><div class="sidebar-guide">${I('spark','lg')}<b>See what's changed</b><p>A short guided walkthrough of features shaped by our student interviews.</p><button type="button" data-nav="guide">View demo guide ${I('arrow','sm')}</button></div><p class="sidebar-note">Double AJ · SI 511 · Fall 2026</p></div>`}
function mobileNav(){return navItems.map(([v,l,ic])=>`<button type="button" class="${state.view===v?'active':''}" data-nav="${v}" aria-label="${l}">${I(ic)}<span>${v==='find'?'Find':v==='bookings'?'Bookings':v==='safety'?'Safety':v==='host'?'Host':'Home'}</span></button>`).join('')}
function crumb(){const labels={home:'Home',find:'Find a ride',profile:'Host details',bookings:'My bookings',safety:'Trust & safety',host:'Host a ride',guide:'Demo walkthrough'};return `OnRoute <span style="margin:0 10px;color:#a9bbc8">/</span><strong>${labels[state.view]||'Demo'}</strong>`}
function routeStops(from,to){return `<div class="route-line"><div class="stops"><span class="dot"></span><div class="stop-line"></div><span class="dot end"></span></div><div class="route-places"><div><div class="stop-sub">PICKUP · APPROXIMATE AREA</div><div class="stop-title">${esc(from)}</div></div><div><div class="stop-sub">DROP-OFF</div><div class="stop-title">${esc(to)}</div></div></div></div>`}
function homeView(){return `<div class="split"><div class="stack"><section class="hero"><div class="hero-copy"><span class="hero-badge">${I('spark','sm')} Made for the trips that matter</span><h1>Get to class.<br>Go together.</h1><p>Find student-driven rides along routes they already take. Plan ahead, pay less, and keep your schedule in view.</p><button class="btn btn-white" data-action="start-search">Find a ride ${I('arrow','sm')}</button></div><svg class="graphic" viewBox="0 0 310 245" aria-hidden="true"><path d="M33 239C18 140 94 179 99 89S227 40 297 6" stroke="white" stroke-width="21" stroke-linecap="round" fill="none" stroke-dasharray="1 31"/><circle cx="98" cy="86" r="25" stroke="white" stroke-width="7" fill="none"/><circle cx="275" cy="20" r="15" fill="white"/></svg></section><div class="card card-pad"><div class="between"><div><div class="eyebrow">Plan ahead</div><h2 class="h2" style="margin:7px 0">Your Wednesday class ride</h2></div><span class="pill blue">${I('repeat','sm')} Weekly option</span></div><p class="small" style="margin:0 0 20px">Set a recurring ride for predictable trips instead of waiting for a crowded bus.</p>${routeStops('Beekman on Broadway','North Campus · Leinweber')}<div class="between" style="margin-top:22px;flex-wrap:wrap"><span class="rider-chip">${I('clock','sm')} Wed · around 10:20 AM</span><button class="btn btn-primary" data-action="start-search">See matching rides ${I('arrow','sm')}</button></div></div><div class="three"><div class="card info-slab">${I('calendar','lg')}<div><b style="font-size:13px">Standing bookings</b><div class="small">Set it once for your class days.</div></div></div><div class="card info-slab">${I('clock','lg')}<div><b style="font-size:13px">Flexible departures</b><div class="small">See rides within your time window.</div></div></div><div class="card info-slab">${I('shield','lg')}<div><b style="font-size:13px">Safety at a glance</b><div class="small">Review profiles before reserving.</div></div></div></div></div><aside class="stack"><section class="card mini-route"><div class="between"><h3 class="h3">Your ride, your choice</h3><span class="pill">${I('check','sm')} Transparent</span></div><div class="banner-photo">${I('car','xl')}<div class="car-icon">${I('car','xl')}</div></div><div class="metric-row"><div class="metric-icon">${I('wallet','lg')}</div><div><b>From $1.29 per seat</b><p>Example fare: $0.80 shared gas + $0.49 booking fee. No surge pricing.</p></div></div><div class="metric-row" style="margin-top:16px"><div class="metric-icon">${I('shield','lg')}</div><div><b>U-M student community</b><p>Verification and trust details displayed before you confirm.</p></div></div></section><section class="card steps-card"><h3 class="h3">How OnRoute works</h3><div class="stepper"><div class="step"><span class="step-n">1</span><div><b>Set your regular trip</b><p>Choose where and when you need to arrive.</p></div></div><div class="step"><span class="step-n">2</span><div><b>Choose a matching Host</b><p>See time flexibility, seats, and safety details.</p></div></div><div class="step"><span class="step-n">3</span><div><b>Stay in control</b><p>Get an alternative if the plan changes.</p></div></div></div><button class="btn btn-ghost" style="margin-top:13px" data-nav="guide">See the demo walkthrough ${I('arrow','sm')}</button></section></aside></div>`}
function rideCard(r,compact=false){const diff=minutesApart(r),delta=diff?`${diff} min from your time`:'Exact time';return `<article class="card ride-card"><div class="between align-start"><div class="row"><span class="host-avatar ${r.skin}">${esc(r.initials)}</span><div><b style="display:block;font-size:15px">${esc(r.name)}</b><div class="row" style="gap:6px;margin-top:2px"><span class="small" style="color:#ad8023">★ ${esc(r.rating)}</span><span class="small">· ${esc(r.trips)} sample trips</span></div></div></div><span class="pill">${I('checkcircle','sm')} Verified*</span></div><div class="between" style="margin-top:21px"><div><div class="ride-time">${formatted(r.time)}</div><div class="ride-meta">${esc(r.day)} · ${r.seats} seat${r.seats>1?'s':''} open</div></div><span class="pill ${diff>0?'blue':''}">${I('clock','sm')} ${delta}</span></div><div class="ride-mid"><div><div class="stop-sub">FROM</div><div class="place">${esc(r.from)}</div></div><span class="arrow">${I('arrow','sm')}</span><div><div class="stop-sub">TO</div><div class="place">${esc(r.to)}</div></div></div><div class="ride-footer"><div><div class="money">$1.29 <small>/ seat</small></div><div class="small">No surge · example price</div></div><button class="btn btn-primary" data-action="open-profile" data-id="${r.id}">View Host ${I('arrow','sm')}</button></div></article>`}
function findView(){const a=state.search;const result=matches();const related=allRides().filter(r=>exactRoute(r)&&r.seats>0).sort((x,y)=>minutesApart(x)-minutesApart(y));return `<div class="eyebrow">Step 01 · Find a route</div><h1 class="page-title">Let's find your ride.</h1><p class="lead">Choose a planned trip and how flexible your departure can be. OnRoute shows seats on routes students already drive.</p><div class="split" style="margin-top:24px"><div class="stack"><section class="card search-card"><div class="between"><h2 class="h2">Trip details</h2><span class="pill blue">${I('sliders','sm')} Your schedule</span></div><form id="search-form"><div class="form-grid"><div class="field"><label for="search-from">Starting area</label><select name="from" id="search-from">${optionList(fromOptions,a.from)}</select></div><div class="field"><label for="search-to">Destination</label><select name="to" id="search-to">${optionList(toOptions,a.to)}</select></div><div class="field"><label for="search-day">Day of the week</label><select name="day" id="search-day">${optionList(days,a.day)}</select></div><div class="field"><label for="search-time">Preferred departure</label><input type="time" name="time" id="search-time" value="${a.time}" required></div><div class="field"><label for="search-window">Flexible time window</label><select name="window" id="search-window"><option value="0" ${a.window===0?'selected':''}>Exact time only</option><option value="15" ${a.window===15?'selected':''}>± 15 minutes</option><option value="30" ${a.window===30?'selected':''}>± 30 minutes</option><option value="60" ${a.window===60?'selected':''}>± 60 minutes</option></select></div><div class="field" style="justify-content:end"><label>Booking type</label><label class="checkrow" style="padding:7px 0"><input type="checkbox" name="repeat" ${a.repeat?'checked':''}><span><b>Repeat weekly</b><small>Perfect for class days</small></span></label></div></div><div class="action-row"><button class="btn btn-primary" type="submit">${I('search','sm')} Find matching rides</button><span>Matches are examples for this concept demo.</span></div></form></section>${state.searched?`<section><div class="section-heading"><div><div class="eyebrow">Available example rides</div><h2 class="h2" style="margin-top:5px">${result.length?`${result.length} matching ride${result.length>1?'s':''}`:'No rides in this window'}</h2></div><span class="pill gray">${I('clock','sm')} ${a.window===0?'Exact time':`± ${a.window} min`}</span></div><div class="results-grid">${result.length?result.map(r=>rideCard(r)).join(''):`<div class="empty-state"><span class="symbol">${I('search','xl')}</span><h3>No exact match yet</h3><p>${related.length?`We found ${related.length} ride${related.length>1?'s':''} on this route, but not in your current time window. Try a flexible departure.`:'We don’t have a sample ride on this route and day. Try our Wednesday Beekman → Leinweber example.'}</p><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" data-action="expand-window">${I('clock','sm')} Try ± 60 minutes</button><button class="btn btn-outline" data-action="demo-route">Try example route</button></div></div>`}</div></section>`:`<section class="soft-card card-pad"><div class="row">${I('info','lg')}<div><b>Why a flexible window?</b><p class="small" style="margin:3px 0 0">Our early matching test found that similar routes can still miss on timing. Broader windows give riders more choices.</p></div></div></section>`}</div><aside class="stack"><section class="card mini-route"><div class="between"><h3 class="h3">Your route</h3><span class="pill blue">${I('pin','sm')} Sample</span></div>${routeStops(a.from,a.to)}<div class="mini-route-footer"><div><b>${esc(a.day)} · ${formatted(a.time)}</b><div class="small">Preferred start</div></div><button class="btn btn-outline" data-action="expand-window">${I('clock','sm')} Flex time</button></div></section><section class="notice teal">${I('spark','lg')}<div><b>Designed after our route-match test</b><p>8 of 12 riders in our sample had a potential match. Timing and seat availability were the main obstacles, so time flexibility is built into the search.</p></div></section><section class="card sidebar-mini"><h3>What you'll see before booking</h3><div class="trust-grid"><div class="row">${I('shield')} Student verification details</div><div class="row">${I('wallet')} Full example price upfront</div><div class="row">${I('people')} Seats and recurring availability</div></div></section></aside></div>`}
function profileView(){const r=getRide(state.selected);return `<button class="btn btn-ghost" data-nav="find">${I('back','sm')} Back to matches</button><div class="eyebrow" style="margin-top:18px">Step 02 · Review the Host</div><h1 class="page-title">Know who's driving.</h1><p class="lead">Review the route, trust details and price before you choose to reserve.</p><div class="split" style="margin-top:25px"><div class="stack"><section class="detail-hero"><div class="row align-start"><span class="avatar-big">${esc(r.initials)}</span><div><h2 style="font-size:27px;letter-spacing:-.05em;margin:0">${esc(r.name)}</h2><div class="row" style="margin-top:5px"><span class="pill">${I('checkcircle','sm')} U-M verified*</span><span class="pill blue">★ ${r.rating} sample rating</span></div><div class="small" style="margin-top:11px">${esc(r.description)}</div></div></div><div style="height:22px"></div><h3 class="h3">Example safety checks</h3><div class="verify"><div class="verify-cell">${I('checkcircle')} U-M email verified</div><div class="verify-cell">${I('checkcircle')} License checked</div><div class="verify-cell">${I('checkcircle')} Insurance checked</div><div class="verify-cell">${I('checkcircle')} Trip sharing option</div></div><div class="small" style="margin-top:13px">*Demonstration labels only. No actual identity or document verification is performed.</div></section><section class="card card-pad"><h3 class="h3">Ride details</h3>${routeStops(r.from,r.to)}<div class="booking-line" style="margin-top:13px"><span>Departure</span><strong>${r.day} · ${formatted(r.time)}</strong></div><div class="booking-line"><span>Open seats</span><strong>${r.seats}</strong></div><div class="booking-line"><span>Time difference</span><strong>${minutesApart(r)} min from your plan</strong></div><div class="booking-line"><span>Gas share (example)</span><strong>$0.80</strong></div><div class="booking-line"><span>Platform fee (example)</span><strong>$0.49</strong></div><div class="booking-line" style="font-size:15px"><span>Total per trip</span><strong>$1.29</strong></div></section></div><aside class="stack"><section class="card card-pad"><span class="pill">${I('shield','sm')} Review before booking</span><h3 style="font-size:23px;letter-spacing:-.05em;margin:13px 0">${formatted(r.time)} · ${r.day}</h3><div class="small">${esc(r.from)} → ${esc(r.to)}</div><div class="booking-note" style="margin:19px 0">${I('lock','lg')}<div><b>Privacy first</b><p>Before booking, the pickup is approximate. You control trip-location sharing.</p></div></div><button class="btn btn-primary full" data-action="review-booking" data-id="${r.id}">Review booking ${I('arrow','sm')}</button><p class="small" style="text-align:center;margin:10px 0 0">No payment or reservation is made in this demo.</p></section><section class="card sidebar-mini"><h3>What students told us</h3><p class="small" style="margin:0">Trust matters when the driver is someone you have never met. These safety screens show our proposed design, not a tested guarantee.</p><button class="btn btn-ghost" data-nav="safety">Explore safety features ${I('arrow','sm')}</button></section></aside></div>`}
function bookingsView(){const b=state.booking,r=b?getRide(b.rideId):null,alternative=rideFixtures.find(x=>x.id==='h11');if(!b)return `<div class="eyebrow">Your trips</div><h1 class="page-title">My bookings</h1><div class="empty-state" style="max-width:680px;margin-top:24px"><div class="symbol">${I('calendar','xl')}</div><h3>No bookings in this demo yet</h3><p>Find a route, view a Host profile and reserve a sample seat to see how a standing booking works.</p><button class="btn btn-primary" data-action="start-search">Find a ride ${I('arrow','sm')}</button></div>`;return `<div class="eyebrow">Step 03 · Your plan</div><h1 class="page-title">Your next ride, sorted.</h1><p class="lead">This is a simulated reservation. You can manage a recurring ride and preview what happens when plans change.</p><div class="split" style="margin-top:24px"><div class="stack"><section class="card bookings-card"><div class="between"><span class="pill">${I('checkcircle','sm')} ${state.disruption?'Needs attention':'Demo reservation saved'}</span><span class="small">Booking #DEMO-024</span></div><h2 style="font-size:29px;letter-spacing:-.05em;margin:18px 0 4px">${r.day} · ${formatted(r.time)}</h2><div class="small">${b.repeat?'Repeats every '+({Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday'}[r.day]):'One-time sample booking'}</div><div style="height:20px"></div>${routeStops(r.from,r.to)}<div class="booking-line" style="margin-top:15px"><span>Host</span><strong>${esc(r.name)} · ★ ${r.rating}</strong></div><div class="booking-line"><span>Example fare</span><strong>$1.29</strong></div><div class="booking-line"><span>Live location sharing</span><strong>${b.shareLocation?'On during trip only':'Off'}</strong></div><div class="between" style="margin-top:18px;flex-wrap:wrap"><button class="btn btn-outline" data-action="open-profile" data-id="${r.id}">${I('shield','sm')} View Host</button><button class="btn btn-ghost" data-action="cancel-booking">Cancel demo booking</button></div></section>${state.disruption?`<section class="notice red">${I('alert','lg')}<div><b>Your Host is running late</b><p>This sample disruption shows a 12-minute delay. You're in control: keep this booking or switch to another option.</p></div></section><section class="card card-pad"><div class="eyebrow">Suggested backup</div><h2 class="h2" style="margin-top:9px">Another ride on your route</h2><div class="person-row"><span class="host-avatar a2">JK</span><div style="flex:1"><b>Jordan K. · ${formatted(alternative.time)}</b><div><span>${alternative.seats} seat available · U-M verified*</span></div></div><b>$1.29</b></div><p class="small">This alternative is a sample suggestion, not a real available vehicle.</p><div class="row" style="flex-wrap:wrap;margin-top:15px"><button class="btn btn-primary" data-action="switch-ride">Switch to this ride ${I('arrow','sm')}</button><button class="btn btn-outline" data-action="keep-ride">Keep my booking</button></div></section>`:`<section class="soft-card card-pad"><div class="row align-start">${I('alert','lg')}<div><b>What if your Host is late?</b><p class="small" style="margin:4px 0 14px">Preview a delay alert and a suggested alternative — one of our proposed changes after testing.</p><button class="btn btn-outline" data-action="simulate-late">${I('bolt','sm')} Simulate a Host delay</button></div></div></section>`}</div><aside class="stack"><section class="card sidebar-mini"><h3>OnRoute keeps you informed</h3><div class="stepper"><div class="step"><span class="step-n">${I('calendar','sm')}</span><div><b>Standing booking</b><p>${b.repeat?'Your recurring schedule is displayed clearly.':'You chose a one-time trip.'}</p></div></div><div class="step"><span class="step-n">${I('shield','sm')}</span><div><b>Safety information</b><p>Know the Host and control what you share.</p></div></div><div class="step"><span class="step-n">${I('refresh','sm')}</span><div><b>Backup choices</b><p>See a proposed alternative if a Host is late.</p></div></div></div></section><section class="notice teal">${I('info','lg')}<div><b>Demo behavior</b><p>This reservation exists only in your browser session. There is no real driver, payment, dispatch or alert service.</p></div></section></aside></div>`}
function safetyView(){return `<div class="eyebrow">Trust & privacy</div><h1 class="page-title">Feel informed before you ride.</h1><p class="lead">We've added clearer trust details, trip-sharing choices and less exposure of private locations. These are design proposals pending further testing.</p><div class="split" style="margin-top:25px"><div class="stack"><section class="card card-pad"><span class="pill blue">${I('shield','sm')} Sample Host profile</span><h2 class="h2" style="margin-top:13px">Safety information, upfront</h2><div class="verify" style="margin-top:19px"><div class="verify-cell">${I('checkcircle')} U-M student email</div><div class="verify-cell">${I('checkcircle')} Driver's license check</div><div class="verify-cell">${I('checkcircle')} Insurance check</div><div class="verify-cell">${I('checkcircle')} In-app reporting</div></div><p class="small">All checks shown here are example UI states, not actual verified records.</p></section><section class="card card-pad"><h2 class="h2">Choose what you share</h2><p class="small">Location sharing is a choice. The host sees only your approximate area until a booking is confirmed.</p><label class="checkrow" style="border-top:1px solid var(--line);margin-top:17px"><input id="safety-location" type="checkbox" ${state.shareLocation?'checked':''}><span><b>Share my location during a ride</b><small>Visible to the matched Host and a friend you choose. Stops after the ride ends.</small></span></label><div class="checkrow" style="border-top:1px solid var(--line)">${I('lock','lg')}<span><b>Limit stored location data</b><small>Route information is approximate until booking; live tracking is only for the trip.</small></span></div><div class="checkrow" style="border-top:1px solid var(--line)">${I('shield','lg')}<span><b>Report or block a problem</b><small>A proposed safety feature. The demo does not contact any safety team.</small></span></div><button class="btn btn-outline" data-action="preview-report">${I('alert','sm')} Preview report flow</button></section></div><aside class="stack"><section class="card sidebar-mini"><h3>Why we're being careful</h3><div class="metric-row"><span class="metric-icon">${I('users','lg')}</span><div><b>Rider trust isn't settled</b><p>Our initial Rider trust sample was too small for a conclusion.</p></div></div><div class="metric-row" style="margin-top:19px"><span class="metric-icon">${I('lock','lg')}</span><div><b>Host privacy matters</b><p>Early Host responses raised concerns about personal documents and insurance.</p></div></div></section><section class="notice">${I('info','lg')}<div><b>Important</b><p>This prototype cannot assess real-world safety, harassment prevention, insurance coverage or legal compliance.</p></div></section></aside></div>`}
function hostView(){const d=state.hostDraft;return `<div class="eyebrow">Host mode · Demo</div><h1 class="page-title">Already driving? Share the route.</h1><p class="lead">Hosts post trips they already make — no on-demand driving or extra stops required. Payment covers a share of gas, not a wage.</p><div class="split" style="margin-top:24px"><div class="stack"><section class="card search-card"><div class="between"><h2 class="h2">Your usual commute</h2><span class="pill blue">${I('repeat','sm')} Repeat weekly</span></div><form id="host-form"><div class="form-grid"><div class="field"><label for="host-from">Starting area</label><select name="from" id="host-from">${optionList(fromOptions,d.from)}</select></div><div class="field"><label for="host-to">Campus destination</label><select name="to" id="host-to">${optionList(toOptions,d.to)}</select></div><div class="field"><label for="host-day">Regular driving day</label><select name="day" id="host-day">${optionList(days,d.day)}</select></div><div class="field"><label for="host-time">Departure time</label><input type="time" name="time" value="${d.time}" id="host-time" required></div><div class="field"><label for="host-seats">Empty passenger seats</label><select id="host-seats" name="seats">${[1,2,3,4].map(n=>`<option value="${n}" ${d.seats===n?'selected':''}>${n} seat${n>1?'s':''}</option>`).join('')}</select></div><div class="field" style="justify-content:end"><div class="small">You choose which seats to offer. No one is booked without your confirmation in a real product.</div></div></div><div class="action-row"><button type="submit" class="btn btn-primary">${I('car','sm')} Preview route listing</button></div></form></section>${state.hostPreview?`<section class="host-preview"><span class="pill">${I('checkcircle','sm')} Listing preview</span><h2 class="h2" style="margin-top:16px">${esc(d.day)} · ${formatted(d.time)}</h2>${routeStops(d.from,d.to)}<div class="booking-line" style="margin-top:15px"><span>Available seats</span><strong>${d.seats}</strong></div><div class="booking-line"><span>Example Host gas share</span><strong>About $0.80 per seat</strong></div><p class="small">Your listing is visible only in this demo. We have not verified your eligibility or any documents.</p><button class="btn btn-primary" data-action="publish-route">Publish sample route ${I('arrow','sm')}</button></section>`:''}</div><aside class="stack"><section class="card sidebar-mini"><h3>Hosting should fit your life</h3><div class="stepper"><div class="step"><span class="step-n">1</span><div><b>Keep your existing route</b><p>Share the drive you're already planning to make.</p></div></div><div class="step"><span class="step-n">2</span><div><b>Choose your empty seats</b><p>Decide how many riders you'd consider.</p></div></div><div class="step"><span class="step-n">3</span><div><b>See the gas share</b><p>Example Host payout is limited to a share of gas, not additional earnings.</p></div></div></div></section><section class="notice">${I('shield','lg')}<div><b>Before real hosting</b><p>A real product would need appropriate license, insurance and safety checks. This demo does not ask you to upload documents.</p></div></section></aside></div>`}
function guideView(){return `<div class="eyebrow">Product walkthrough · 90-second storyline</div><h1 class="page-title">See how our tests shaped OnRoute.</h1><p class="lead">A short path through the concept. Each step opens a working part of the clickable demo.</p><div class="guide-grid"><button class="guide-card" data-action="start-search"><div class="guide-index">01</div><b>Find a regular class ride</b><p>Choose a campus trip and a flexible departure window. Based on Test 1.</p></button><button class="guide-card" data-action="open-profile" data-id="h1"><div class="guide-index">02</div><b>Review the Host and full price</b><p>See trust information and the example $1.29 fare. Inspired by Tests 2, 4 and 5.</p></button><button class="guide-card" data-action="guide-book"><div class="guide-index">03</div><b>Set a weekly booking</b><p>Show how predictable supply can fit a class schedule. Based on the timing gap from Tests 2 and 3.</p></button><button class="guide-card" data-action="guide-disruption"><div class="guide-index">04</div><b>Preview a late Host</b><p>Show an alternative rather than promising on-demand rescue rides.</p></button><button class="guide-card" data-nav="host"><div class="guide-index">05</div><b>Post an existing Host route</b><p>Give drivers a simple recurring route form and explain gas-share-only pay.</p></button><button class="guide-card" data-nav="safety"><div class="guide-index">06</div><b>Explore data controls</b><p>Make permission screens clearer before collecting sensitive information.</p></button></div><div class="notice teal" style="margin-top:23px">${I('info','lg')}<div><b>What this prototype does not claim</b><p>It does not validate payment, real Host commitment, identity verification, insurance coverage, or rider safety. These remain open research questions in our submission.</p></div></div>`}
function render(){document.getElementById('sidebar').innerHTML=sidebar();document.getElementById('mobile-nav').innerHTML=mobileNav();document.getElementById('breadcrumbs').innerHTML=crumb();const content={home:homeView,find:findView,profile:profileView,bookings:bookingsView,safety:safetyView,host:hostView,guide:guideView};document.getElementById('view').innerHTML=(content[state.view]||homeView)();renderModal()}
function toast(msg){const e=document.getElementById('toast');e.innerHTML=`${I('checkcircle','sm')} ${esc(msg)}`;e.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('visible'),3400)}
function modal(kind){state.modal=kind;renderModal()}
function renderModal(){const root=document.getElementById('modal-root');if(!state.modal){root.innerHTML='';return}let html='',title='',body='';if(state.modal==='booking'){const r=getRide(state.selected);title='Review your sample booking';body=`<div class="notice teal" style="margin-bottom:15px">${I('info','lg')}<div><b>No real reservation will be placed</b><p>This screen shows the proposed user journey only.</p></div></div><div class="booking-line"><span>Route</span><strong>${esc(r.from)} → ${esc(r.to)}</strong></div><div class="booking-line"><span>Host</span><strong>${esc(r.name)}</strong></div><div class="booking-line"><span>Day & time</span><strong>${esc(r.day)} · ${formatted(r.time)}</strong></div><div class="booking-line"><span>Gas share</span><strong>$0.80</strong></div><div class="booking-line"><span>Booking fee</span><strong>$0.49</strong></div><div class="booking-line"><span>Total example fare</span><strong>$1.29</strong></div><label class="checkrow"><input type="checkbox" id="book-repeat" ${state.search.repeat?'checked':''}><span><b>Make this a standing weekly booking</b><small>Repeat on ${esc(r.day)} for my class schedule.</small></span></label><label class="checkrow" style="border-top:1px solid var(--line)"><input type="checkbox" id="book-share" ${state.shareLocation?'checked':''}><span><b>Share my location during this trip</b><small>Optional. Stops at trip end; no live tracking in the demo.</small></span></label><div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Back</button><button class="btn btn-primary" data-action="confirm-booking">Confirm demo booking ${I('arrow','sm')}</button></div>`}else if(state.modal==='cancel'){title='Cancel sample booking?';body=`<p class="small">This will remove the current reservation from your demo session. No real Host is notified.</p><div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Keep it</button><button class="btn btn-danger" data-action="confirm-cancel">Cancel booking</button></div>`}else if(state.modal==='report'){title='Preview: Report a safety concern';body=`<div class="notice">${I('alert','lg')}<div><b>Prototype only</b><p>This report flow is not connected to a support or emergency service. Do not enter a real safety report here.</p></div></div><div class="field" style="margin-top:18px"><label>What happened? (example categories)</label><select disabled><option>Unsafe driving</option><option>Harassment</option><option>Other concern</option></select></div><div class="modal-footer"><button class="btn btn-primary" data-action="close-modal">Close preview</button></div>`}else if(state.modal==='guide-book'){title='Start with a realistic sample';body=`<p>This walkthrough will choose the Wednesday 10:15 AM Host for the Beekman → Leinweber route. You'll see the weekly booking step next.</p><div class="modal-footer"><button class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" data-action="continue-guide-book">Continue ${I('arrow','sm')}</button></div>`}root.innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><div><div class="eyebrow">OnRoute · Demo</div><h2>${esc(title)}</h2></div><button class="modal-close" type="button" aria-label="Close dialog" data-action="close-modal">${I('close')}</button></div><div class="modal-body">${body}</div></section></div>`;root.querySelector('.modal-close')?.focus({preventScroll:true})}
function go(v){state.view=v;if(v==='host')state.mode='host';render();window.scrollTo({top:0,behavior:'instant'})}
function demoRoute(){state.search={from:'Beekman on Broadway',to:'North Campus · Leinweber',day:'Wed',time:'10:20',window:15,repeat:true};state.searched=true;go('find')}
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();const d=new FormData(e.target);state.search={from:d.get('from'),to:d.get('to'),day:d.get('day'),time:d.get('time'),window:Number(d.get('window')),repeat:d.get('repeat')==='on'};state.searched=true;render();return}if(e.target.id==='host-form'){e.preventDefault();const d=new FormData(e.target);state.hostDraft={from:d.get('from'),to:d.get('to'),day:d.get('day'),time:d.get('time'),seats:Number(d.get('seats'))};state.hostPreview=true;render();toast('Route preview ready — no trip has been posted.')}});
document.addEventListener('change',e=>{if(e.target.id==='safety-location'){state.shareLocation=e.target.checked;toast(`Demo preference: location sharing ${state.shareLocation?'on':'off'}`)}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const button=e.target.closest('[data-action]');if(!button){if(e.target.classList?.contains('modal-backdrop')){state.modal=null;renderModal()}return}const action=button.dataset.action;if(action==='start-search'){state.searched=true;go('find')}else if(action==='demo-route')demoRoute();else if(action==='expand-window'){state.search.window=60;state.searched=true;render();toast('Showing rides within ±60 minutes')}else if(action==='open-profile'){state.selected=button.dataset.id;go('profile')}else if(action==='review-booking'){state.selected=button.dataset.id;modal('booking')}else if(action==='close-modal'){state.modal=null;renderModal()}else if(action==='confirm-booking'){const r=getRide(state.selected);state.booking={rideId:r.id,repeat:document.getElementById('book-repeat')?.checked||false,shareLocation:document.getElementById('book-share')?.checked||false};state.disruption=false;state.modal=null;go('bookings');toast('Sample booking saved in this demo')}else if(action==='simulate-late'){state.disruption=true;render()}else if(action==='switch-ride'){const r=getRide('h11');state.booking={...state.booking,rideId:r.id};state.disruption=false;go('bookings');toast('Switched to the sample alternative')}else if(action==='keep-ride'){state.disruption=false;render();toast('Kept your original sample ride')}else if(action==='cancel-booking')modal('cancel');else if(action==='confirm-cancel'){state.modal=null;state.booking=null;state.disruption=false;go('bookings');toast('Demo booking canceled')}else if(action==='preview-report')modal('report');else if(action==='guide-book')modal('guide-book');else if(action==='continue-guide-book'){state.modal=null;state.search={from:'Beekman on Broadway',to:'North Campus · Leinweber',day:'Wed',time:'10:20',window:15,repeat:true};state.selected='h1';modal('booking')}else if(action==='guide-disruption'){if(!state.booking){state.booking={rideId:'h1',repeat:true,shareLocation:false}}state.disruption=true;go('bookings')}else if(action==='publish-route'){const d=state.hostDraft;const r={id:'custom'+(state.hostPublished.length+1),name:'You (sample)',initials:'AJ',skin:'a4',...d,trips:0,rating:'—',description:'Sample route added in this browser session.'};state.hostPublished.push(r);state.hostPreview=false;render();toast('Sample route is now available in the demo.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;renderModal()}});
render();
</script>
</body>
</html>
